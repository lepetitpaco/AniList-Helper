<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AniList Helper</title>
  <style>
    :root {
      --bg: #0b1622;
      --card: #151f2e;
      --text: #d3d5f3;
      --muted: #8ba0b2;
      --accent: #3db4f2;
      --track: #2b3a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }
    header img { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    main { padding: 0 12px 12px; display: grid; gap: 8px; }
    .feature { padding: 12px; background: var(--card); border-radius: 6px; }
    .feature-row { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
    .option {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 8px;
      padding-left: 2px;
      font-size: 12px;
      cursor: pointer;
    }
    .option input { margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
    .option.disabled { opacity: .45; cursor: default; }
    .feature-row + .option { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--track); }
    .feature-text { flex: 1; }
    .feature-label { font-weight: 600; }
    .feature-description { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .switch { position: relative; flex: none; width: 34px; height: 20px; margin-top: 1px; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--track);
      transition: background .15s;
    }
    .switch span::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { padding: 0 16px 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <h1>AniList Helper</h1>
  </header>
  <main id="features"></main>
  <footer>Changes apply right away on open AniList tabs.</footer>
  <script src="src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
